[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-ar"
version = "2.5.0"
description = "FRAME-AR v2: Tamper-Proof Autonomous Research & Statistical Verification Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
frame = "frame.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frame*"]
