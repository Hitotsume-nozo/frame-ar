[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-ar"
version = "0.1.0"
description = "Foundation for Rigorous Autonomous & Mathematical Experimentation — Auto-Research"
authors = [{ name = "Autonomous Research Framework Core" }]
readme = "FRAME_AR_SPECIFICATION.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["frame*"]

[tool.pytest.ini_options]
pythonpath = ["."]
